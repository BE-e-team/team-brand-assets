
name: Generate email signatures

on:
  push:
    branches:
      - main
    paths:
      - 'signatures/**'
      - '.github/workflows/generate-signatures.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate signatures
        working-directory: signatures
        run: python generate.py

      - name: Commit generated signatures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "signatures/individual signatures/"
          if ! git diff --cached --quiet; then
            git commit -m "Update generated email signatures"
            git push
          fi
